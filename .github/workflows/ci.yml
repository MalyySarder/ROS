name: ROS PR07 checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr07:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:12f03ad224f4f7801c4eeb320934b198fe0b9536d70f2f617894da08ca3bedba
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
      COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install package test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get upgrade -y --with-new-pkgs
          apt-get install -y --no-install-recommends python3-pytest \
            ros-lyrical-ament-copyright ros-lyrical-ament-flake8 \
            ros-lyrical-ament-mypy ros-lyrical-ament-pep257 ros-lyrical-ament-xmllint \
            ros-lyrical-ament-cmake-pytest ros-lyrical-xacro liburdfdom-tools \
            ros-lyrical-ackermann-msgs ros-lyrical-ros-gz
      - name: Build and verify installed launch
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol course_bringup course_description course_simulation
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
      - name: Test nodes, robot model and simulation adapters
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          python3 -c "from patrol.patrol import Patrol"
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf
          colcon test --packages-select patrol course_description course_simulation --event-handlers console_direct+
          colcon test-result --verbose
      - name: Download pinned course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit
      - name: Check evidence
        shell: bash
        run: |
          python3 -m json.tool evidence/pr01/environment.json > /dev/null
          python3 .course-kit/v1/tools/check_practice.py PR07 --submission .
