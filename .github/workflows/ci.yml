name: ROS PR06 checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr06:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
      COURSE_KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install package test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pytest \
            ros-jazzy-ament-copyright ros-jazzy-ament-flake8 \
            ros-jazzy-ament-mypy ros-jazzy-ament-pep257 ros-jazzy-ament-xmllint \
            ros-jazzy-ament-cmake-pytest ros-jazzy-xacro liburdfdom-tools
      - name: Build and verify installed launch
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol course_bringup course_description
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
      - name: Test patrol and robot model
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -c "from patrol.patrol import Patrol"
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          check_urdf /tmp/vehicle.urdf
          colcon test --packages-select patrol course_description --event-handlers console_direct+
          colcon test-result --verbose
      - name: Download pinned course kit
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit
      - name: Check evidence
        shell: bash
        run: |
          python3 -m json.tool evidence/pr01/environment.json > /dev/null
          python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
